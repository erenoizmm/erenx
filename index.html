<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yakında</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%; height:100%;
      overflow:hidden;
      background:#05080f;
      font-family:'Outfit', sans-serif;
    }

    .sky {
      position:fixed; inset:0;
      background: radial-gradient(ellipse 100% 80% at 50% 0%,
        #0d1b3e 0%, #050d1f 55%, #02060f 100%);
      z-index:0;
    }

    .aurora {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:
        radial-gradient(ellipse 70% 40% at 30% 20%, rgba(60,130,255,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 60% 35% at 75% 15%, rgba(120,60,220,0.06) 0%, transparent 65%),
        radial-gradient(ellipse 80% 50% at 50% 90%, rgba(20,40,100,0.25) 0%, transparent 70%);
      animation: auroraShift 12s ease-in-out infinite alternate;
    }
    @keyframes auroraShift {
      0%   { opacity:0.7; transform:scale(1) translateX(0); }
      100% { opacity:1;   transform:scale(1.05) translateX(20px); }
    }

    canvas {
      position:fixed; inset:0; z-index:2; pointer-events:none;
    }

    .fog {
      position:fixed; bottom:0; left:0; right:0; height:220px; z-index:3;
      background: linear-gradient(to top,
        rgba(180,210,255,0.06) 0%,
        rgba(100,150,220,0.02) 60%,
        transparent 100%);
      pointer-events:none;
    }

    .wrap {
      position:fixed; inset:0; z-index:10;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center;
    }

    .line-top {
      width:1px; height:60px;
      background: linear-gradient(to bottom, transparent, rgba(150,180,255,0.4));
      margin-bottom:32px;
      animation: growLine 1.8s cubic-bezier(0.22,1,0.36,1) forwards;
      transform-origin: top;
      opacity:0;
    }
    @keyframes growLine {
      from { opacity:0; transform:scaleY(0); }
      to   { opacity:1; transform:scaleY(1); }
    }

    .site-label {
      font-size:11px;
      font-weight:300;
      letter-spacing:0.5em;
      color:rgba(150,180,255,0.45);
      text-transform:uppercase;
      margin-bottom:28px;
      opacity:0;
      animation: riseIn 1.2s 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .big {
      font-family:'Bebas Neue', sans-serif;
      font-size: clamp(90px, 18vw, 200px);
      line-height:0.85;
      letter-spacing:0.04em;
      color:#fff;
      text-shadow:
        0 0 80px rgba(80,130,255,0.25),
        0 0 200px rgba(60,100,220,0.15);
      opacity:0;
      animation: riseIn 1.4s 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
      user-select:none;
    }
    .big .accent {
      display:block;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(150,190,255,0.5);
      font-size: clamp(86px, 17vw, 190px);
    }

    .orn {
      display:flex; align-items:center; gap:16px;
      margin: 36px 0 32px;
      opacity:0;
      animation: riseIn 1.2s 1s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .orn-line { width:80px; height:1px; background:rgba(120,160,255,0.2); }
    .orn-dot  { width:4px; height:4px; background:rgba(140,180,255,0.5);
                border-radius:50%; box-shadow:0 0 8px rgba(120,160,255,0.6); }

    .tagline {
      font-size: clamp(13px, 2vw, 17px);
      font-weight:200;
      letter-spacing:0.18em;
      color:rgba(180,210,255,0.45);
      text-transform:uppercase;
      opacity:0;
      animation: riseIn 1.2s 1.1s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    .line-bottom {
      width:1px; height:60px;
      background: linear-gradient(to bottom, rgba(150,180,255,0.4), transparent);
      margin-top:36px;
      opacity:0;
      animation: riseIn 1.2s 1.3s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    @keyframes riseIn {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .glow-orb {
      position:fixed;
      width:600px; height:300px;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      background: radial-gradient(ellipse, rgba(60,100,255,0.07) 0%, transparent 70%);
      border-radius:50%;
      z-index:4; pointer-events:none;
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { transform:translate(-50%,-50%) scale(0.9); opacity:0.6; }
      to   { transform:translate(-50%,-50%) scale(1.1); opacity:1; }
    }
  </style>
</head>
<body>

<div class="sky"></div>
<div class="aurora"></div>
<canvas id="snow"></canvas>
<div class="fog"></div>
<div class="glow-orb"></div>

<div class="wrap">
  <div class="line-top"></div>
  <div class="site-label"></div>
  <div class="big">
    Yakında
    <span class="accent">Açılıyor</span>
  </div>
  <div class="orn">
    <div class="orn-line"></div>
    <div class="orn-dot"></div>
    <div class="orn-dot" style="opacity:0.35;width:3px;height:3px;"></div>
    <div class="orn-dot"></div>
    <div class="orn-line"></div>
  </div>
  <div class="tagline">Site Bakımda</div>
  <div class="line-bottom"></div>
</div>

<script>
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const FLAKES = 280;
  const flakes = [];

  for (let i = 0; i < FLAKES; i++) {
    flakes.push({
      x:     Math.random() * window.innerWidth,
      y:     Math.random() * window.innerHeight,
      r:     0.5 + Math.random() * 2.8,
      speed: 0.4 + Math.random() * 1.2,
      drift: (Math.random() - 0.5) * 0.6,
      opacity: 0.15 + Math.random() * 0.65,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.005 + Math.random() * 0.015,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    flakes.forEach(f => {
      f.wobble += f.wobbleSpeed;
      f.x += f.drift + Math.sin(f.wobble) * 0.4;
      f.y += f.speed;

      if (f.y > canvas.height + 10) {
        f.y = -10;
        f.x = Math.random() * canvas.width;
      }
      if (f.x > canvas.width + 10)  f.x = -10;
      if (f.x < -10) f.x = canvas.width + 10;

      if (f.r > 1.8) {
        const grd = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 3);
        grd.addColorStop(0, `rgba(200,220,255,${f.opacity * 0.3})`);
        grd.addColorStop(1, 'rgba(200,220,255,0)');
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,235,255,${f.opacity})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  draw();
</script>
</body>
</html>
