<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eye Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  const eyes = [
    { x: cx - 38, y: cy },
    { x: cx + 38, y: cy }
  ];

  const EYE_W = 28;
  const EYE_H = 20;

  const P1 = 600;
  const P2 = 2800;
  const P3 = 4200;
  const P4 = 5400;
  const P5 = 6600;
  const P6 = 8400;
  const LOOP_DELAY = 800; // kapandıktan sonra bekle, sonra tekrar başla

  let startTime = null;

  function easeInOut(t) {
    return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
  }

  function clamp(v, lo, hi) {
    return Math.min(Math.max(v, lo), hi);
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function lerpColor(c1, c2, t) {
    return [
      Math.round(lerp(c1[0], c2[0], t)),
      Math.round(lerp(c1[1], c2[1], t)),
      Math.round(lerp(c1[2], c2[2], t)),
    ];
  }

  function toRgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

  const WHITE = [255, 255, 255];
  const RED   = [180, 0, 0];

  function drawEye(x, y, openRatio, scleraColor) {
    if (openRatio <= 0.005) return;

    const h = EYE_H * openRatio;

    ctx.save();
    ctx.translate(x, y);

    ctx.beginPath();
    ctx.ellipse(0, 0, EYE_W, h, 0, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = toRgb(scleraColor);
    ctx.fillRect(-EYE_W, -h, EYE_W * 2, h * 2);

    const pupilR = EYE_W * 0.36 * openRatio;
    ctx.beginPath();
    ctx.arc(0, 0, pupilR, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();

    ctx.restore();
  }

  function frame(ts) {
    if (!startTime) startTime = ts;
    const e = ts - startTime;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let open = 0;
    let color = WHITE;

    if (e < P1) {
      open = 0;

    } else if (e < P2) {
      open = easeInOut(clamp((e - P1) / (P2 - P1), 0, 1));
      color = WHITE;

    } else if (e < P3) {
      open = 1;
      color = WHITE;

    } else if (e < P4) {
      const t = easeInOut(clamp((e - P3) / (P4 - P3), 0, 1));
      open = 1;
      color = lerpColor(WHITE, RED, t);

    } else if (e < P5) {
      open = 1;
      color = RED;

    } else if (e < P6) {
      const t = easeInOut(clamp((e - P5) / (P6 - P5), 0, 1));
      open = 1 - t;
      color = RED;

    } else {
      open = 0;
      color = RED;
    }

    for (const eye of eyes) {
      drawEye(eye.x, eye.y, open, color);
    }

    if (e < P6 + LOOP_DELAY) {
      requestAnimationFrame(frame);
    } else {
      // Sıfırla ve döngüye al
      startTime = null;
      requestAnimationFrame(frame);
    }
  }

  requestAnimationFrame(frame);
</script>
</body>
</html>
