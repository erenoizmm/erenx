<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta PINKGALAXY – 800 $</title>
<meta name="description" content="Cuenta PINKGALAXY totalmente equipada al máximo: 48 láseres LF-4, escudos al máximo y árbol de habilidades completado. Precio: 800 $.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a1c; --panel:#171232; --line:#2e2655;
  --text:#efeaff; --muted:#b3a9d6; --pink:#ff4da6; --violet:#6c4dff;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{
  min-height:100vh; color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.6;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(255,77,166,.18), transparent 60%),
    radial-gradient(800px 600px at -10% 20%, rgba(108,77,255,.20), transparent 60%),
    var(--bg);
}
.wrap{max-width:1100px;margin:0 auto;padding:40px 16px 64px}

.head{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.head-text{flex:1 1 420px;max-width:640px}
h1{font-family:"Chakra Petch",system-ui,sans-serif;font-weight:700;font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.01em;margin-bottom:14px}
.desc{color:var(--muted);font-size:1.05rem}
.price{
  flex:0 0 auto; text-align:right; padding:14px 22px; border-radius:14px;
  border:1px solid var(--pink); background:rgba(255,77,166,.08);
}
.price b{display:block;font-family:"Chakra Petch",system-ui,sans-serif;font-size:2.6rem;line-height:1.1;color:#fff}
.price span{font-size:.9rem;color:var(--muted)}

.fb{
  display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:14px 26px;border-radius:999px;
  background:linear-gradient(135deg,#1877f2,#0b5bd3);color:#fff;text-decoration:none;
  font-family:"Chakra Petch",system-ui,sans-serif;font-weight:600;font-size:1.05rem;
  box-shadow:0 8px 28px rgba(24,119,242,.40);transition:transform .15s,box-shadow .15s
}
.fb:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(24,119,242,.55)}
.fb:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.cta-end{margin-top:40px;padding:28px 16px;text-align:center;border:1px solid var(--line);border-radius:16px;background:rgba(23,18,50,.6)}
.cta-end p{color:var(--muted)}
.cta-end b{color:#fff;font-size:1.3rem;font-family:"Chakra Petch",system-ui,sans-serif}
.cta-end .fb{margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.tile.wide{grid-column:span 2}}
.tile{
  display:block;width:100%;padding:0;cursor:zoom-in;overflow:hidden;
  aspect-ratio:4/3;border-radius:10px;border:1px solid var(--line);background:#05030d;
}
.tile.wide{aspect-ratio:2/1}
@media(max-width:699px){.tile.wide{grid-column:span 2}}
.tile img{width:100%;height:100%;display:block;object-fit:contain}
.tile.ship img{object-fit:cover}
.tile:hover{border-color:var(--pink)}
.tile:focus-visible,.lb button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.lb{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(5,3,13,.94);padding:16px}
.lb:not([hidden]){display:grid}
.lb img{max-width:100%;max-height:86vh;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
.lb button{
  position:absolute;background:var(--panel);color:var(--text);border:1px solid var(--line);
  width:48px;height:48px;border-radius:50%;font-size:1.5rem;cursor:pointer;line-height:1
}
.lb button:hover{border-color:var(--pink)}
.lb .close{top:14px;right:14px}
.lb .prev{left:12px;top:50%;transform:translateY(-50%)}
.lb .next{right:12px;top:50%;transform:translateY(-50%)}
.lb .count{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main class="wrap">

  <header class="head">
    <div class="head-text">
      <h1>Cuenta PINKGALAXY</h1>
      <p class="desc">Totalmente equipada al máximo (48 láseres LF-4, escudos al máximo y árbol de habilidades completado). Descuento disponible para compradores serios.</p>
      <a class="fb" href="https://www.facebook.com/share/1PQx4GqXPg/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>Contactar por Facebook</a>
    </div>
    <div class="price">
      <span>Precio</span>
      <b>800 $</b>
    </div>
  </header>

  <section class="grid" aria-label="Fotos de la cuenta">
    <button class="tile wide ship" type="button"><img src="https://r.resimlink.com/Kj2Uc6JH.jpg" alt="Nave de la cuenta" loading="lazy" referrerpolicy="no-referrer"></button>
    <button class="tile wide ship" type="button"><img src="https://r.resimlink.com/i1YM53V9.jpg" alt="Nave de la cuenta, segunda vista" loading="lazy" referrerpolicy="no-referrer"></button>
    <button class="tile wide" type="button"><img src="https://r.resimlink.com/0Oge75-w.jpg" alt="48 láseres LF-4 en el inventario" loading="lazy" referrerpolicy="no-referrer"></button>
    <button class="tile " type="button"><img src="https://r.resimlink.com/WpEktmO.png" alt="Inventario de la cuenta" loading="lazy" referrerpolicy="no-referrer"></button>
    <button class="tile " type="button"><img src="https://r.resimlink.com/Nf6kR0rVB9a.jpg" alt="Inventario de la cuenta" loading="lazy" referrerpolicy="no-referrer"></button>
    <button class="tile wide" type="button"><img src="https://r.resimlink.com/Sy06bBVp.jpg" alt="Inventario de la cuenta" loading="lazy" referrerpolicy="no-referrer"></button>
    <button class="tile wide" type="button"><img src="https://r.resimlink.com/qe5dNMyWA4a.jpg" alt="Árbol de habilidades de la cuenta" loading="lazy" referrerpolicy="no-referrer"></button>
  </section>

  <section class="cta-end">
    <p><b>800 $</b></p>
    <p>Descuento disponible para compradores serios.</p>
    <a class="fb" href="https://www.facebook.com/share/1PQx4GqXPg/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>Contactar por Facebook</a>
  </section>

</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Visor de fotos">
  <button class="close" type="button" aria-label="Cerrar">×</button>
  <button class="prev" type="button" aria-label="Anterior">‹</button>
  <img src="" alt="">
  <button class="next" type="button" aria-label="Siguiente">›</button>
  <div class="count"></div>
</div>

<script>
(function(){
  var tiles=[].slice.call(document.querySelectorAll('.tile'));
  var lb=document.getElementById('lb'),
      img=lb.querySelector('img'),
      count=lb.querySelector('.count'),
      i=0,last=null,x0=null;

  function show(n){
    i=(n+tiles.length)%tiles.length;
    var s=tiles[i].querySelector('img');
    img.src=s.src; img.alt=s.alt;
    count.textContent=(i+1)+' / '+tiles.length;
  }
  function open(n){
    last=document.activeElement; show(n);
    lb.hidden=false; document.body.style.overflow='hidden';
    lb.querySelector('.close').focus();
  }
  function close(){
    lb.hidden=true; document.body.style.overflow='';
    if(last) last.focus();
  }

  tiles.forEach(function(t,n){t.addEventListener('click',function(){open(n)})});
  lb.querySelector('.close').addEventListener('click',close);
  lb.querySelector('.prev').addEventListener('click',function(){show(i-1)});
  lb.querySelector('.next').addEventListener('click',function(){show(i+1)});
  lb.addEventListener('click',function(e){if(e.target===lb)close()});

  document.addEventListener('keydown',function(e){
    if(lb.hidden)return;
    if(e.key==='Escape')close();
    if(e.key==='ArrowLeft')show(i-1);
    if(e.key==='ArrowRight')show(i+1);
  });

  lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){
    if(x0===null)return;
    var d=e.changedTouches[0].clientX-x0;
    if(Math.abs(d)>50) show(d<0?i+1:i-1);
    x0=null;
  });
})();
</script>
</body>
</html>
